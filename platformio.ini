; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; platform 釘版：與 i2cESP32 主機一致（Arduino core 2.0.17）。
; 未釘版時本機並存 espressif32 3.0.0 / 6.13.0，兩端 core 不同會讓
; Wire slave 行為不可預期。見 docs/i2c_slave_sdd.md §7。
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
	bblanchon/ArduinoJson @ ^6.21.2
	madhephaestus/ESP32Servo@^1.1.2
	ottowinter/ESPAsyncWebServer-esphome@^3.3.0

; 桌上模式：手機網頁 / Blockly / 搖桿 / PS4。WiFi AP_STA 常駐，無 I2C 從機。
; 純教學／機構驗證用，不掛主機匯流排。
[env:esp32dev]

; 從機模式：掛 i2cESP32 主機匯流排（0x36），**且 WiFi AP_STA 常駐**。
;
; 原本這裡註明兩者互斥（SDD §7.1，WiFi task prio 23 搶佔 i2c_slave_task
; prio 20）。2026-08-25 實測推翻：六組設定 + 四個真人操作網頁的負載窗口共
; 240 秒，含 AP_STA + Web 伺服器 + prio 20，零 loop 警告、零 bus recovery、
; 底盤 0x30 全程 healthy 100%。見 robot repo 的
; docs/architecture/blockly_module_contract_sdd.md §8.1。
;
; 不另開 env 的理由：沒有 WiFi 的從機模式已無使用情境（學生必須能改程式），
; 多一個 env 只會多一種燒錯版本的失敗模式。
[env:esp32dev_i2c]
build_flags =
	-D I2C_SLAVE_MODE=1
