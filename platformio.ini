; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; platform 釘版：與 i2cESP32 主機一致（Arduino core 2.0.17）。
; 未釘版時本機並存 espressif32 3.0.0 / 6.13.0，兩端 core 不同會讓
; Wire slave 行為不可預期。見 docs/i2c_slave_sdd.md §7。
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
	bblanchon/ArduinoJson @ ^6.21.2
	madhephaestus/ESP32Servo@^1.1.2
	ottowinter/ESPAsyncWebServer-esphome@^3.3.0

; 桌上模式：手機網頁 / Blockly / 搖桿 / PS4。WiFi AP_STA 常駐。
; 此 env 不可掛上主機 I2C 匯流排——WiFi task（prio 23）會搶佔
; i2c_slave_task（prio 20），造成主機 bus recovery。見 SDD §7.1。
[env:esp32dev]

; 從機模式：掛 i2cESP32 主機匯流排（0x36）。WiFi 完全不啟動。
[env:esp32dev_i2c]
build_flags =
	-D I2C_SLAVE_MODE=1
