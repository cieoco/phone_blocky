<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>可程式積木控制器</title>
  <!-- 載入 Blockly -->
  <script src="blockly.min.js"></script>
  <!-- 載入客戶端邏輯 -->
  <script src="appBlock.js?v=20261010-mobile"></script>
  <script src="appIr.js?v=20261010-mobile"></script>
  <script src="appJson.js?v=20261010-mobile"></script>
  <script src="app.js?v=20261010-mobile"></script>
  <style>
    /* ========================================================================
       版面：固定高度的 app shell，整頁不捲動。
       為什麼不用原本的「長頁面 + 固定高度積木視窗」：
       那會造成兩層捲動互搶 —— 頁面會捲、積木畫布也會平移，手指在畫布邊緣
       一拖，瀏覽器分不出你要平移畫布還是捲頁面；而且一捲頁面，正在編輯的
       工作區就有一半移出螢幕。改成整頁不捲動之後，唯一會動的只有畫布。
       ===================================================================== */
    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #4d7fff;
      font-family: sans-serif;
      /* 手機上長按不要跳出選取/放大鏡，那會干擾拖曳積木 */
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      /* 100dvh 會排除手機瀏覽器工具列；舊瀏覽器退回 100vh */
      height: 100vh;
      height: 100dvh;
      background: white;
      overflow: hidden;
    }

    /* ---- 頂列：越薄越好，只放不常按但要隨時能按的東西 ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #e5e5e5;
      flex: 0 0 auto;
    }

    .topbar .title {
      font-weight: bold;
      font-size: 1em;
      color: #333;
      margin-right: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .iconbtn {
      background: #f0f3fa;
      color: #333;
      border: 1px solid #d6dbe8;
      border-radius: 8px;
      /* 44px 是觸控目標的實用下限，小於這個在手機上很容易按錯 */
      min-width: 44px;
      height: 38px;
      font-size: 1em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 10px;
    }

    .iconbtn:active {
      background: #dde4f5;
    }

    /* ---- 畫布：唯一會動的區域，吃掉所有剩餘空間 ---- */
    .canvas-wrap {
      flex: 1 1 auto;
      /* min-height:0 不可省：flex 子項預設不會縮到內容高度以下，
         少了它畫布會把底列推出螢幕外。 */
      min-height: 0;
      position: relative;
    }

    #blocklyDiv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* 用 outline 取代 border：border 會把 Blockly 內部 SVG 原點推移 1px，
         造成點擊與參數輸入框落點偏移；outline 畫在版面框外、不影響座標。 */
      outline: 1px solid #ccc;
    }

    /* ---- 訊息列：收起時一行，點開成面板 ---- */
    .status-strip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: none;
      border-top: 1px solid #e5e5e5;
      background: #f7f9ff;
      padding: 7px 12px;
      font-size: 0.82em;
      font-family: inherit;
      color: #445;
      text-align: left;
      cursor: pointer;
    }

    .status-strip #statusLatest {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-caret {
      flex: 0 0 auto;
      color: #889;
    }

    .status-strip[aria-expanded="true"] .status-caret {
      transform: rotate(180deg);
    }

    #sensorOutput {
      flex: 0 0 auto;
      max-height: 32dvh;
      overflow-y: auto;
      padding: 8px 12px;
      border-top: 1px solid #e5e5e5;
      background: #fcfcfd;
    }

    /* ---- 底列：編輯時最常按的兩顆，放在拇指最好按的位置 ---- */
    .bottombar {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      /* iPhone 底部手勢區不要蓋住按鈕 */
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }

    .btn {
      background: #4d7fff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 1em;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn:active {
      filter: brightness(0.92);
    }

    .bottombar .btn {
      flex: 1;
      height: 48px;
      font-size: 1.05em;
      font-weight: bold;
    }

    .btn.stop {
      background: #ee5a52;
    }

    .btn.run {
      background: #2f9e6b;
    }

    .btn-local {
      background: #2f9e6b;
    }

    /* ---- 抽屜（底部面板）：存檔／開啟／autorun／Plotter 等偶發操作 ----
       這些動作一次操作幾秒、不是每秒都要按，不該在編輯時佔掉垂直空間。 */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 500;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 501;
      background: white;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
      max-height: 85dvh;
      overflow-y: auto;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    }

    .sheet-head {
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      padding: 4px 0 10px;
      border-bottom: 1px solid #eee;
      margin-bottom: 6px;
    }

    .sheet-head .sheet-title {
      font-weight: bold;
      margin-right: auto;
    }

    /* 程式操作：ESP32 與本機分兩組，按鈕在手機上可換行 */
    .file-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .file-group .btn {
      flex: 1 1 45%;
      min-height: 44px;
    }

    .file-group-label {
      flex-basis: 100%;
      font-size: 0.85em;
      color: #666;
    }

    .info-section {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 8px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    /* 桌機：保留原本的「藍底 + 白卡」外觀，只是改成滿高不捲動 */
    @media (min-width: 769px) {
      body {
        padding: 12px;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        height: calc(100dvh - 24px);
        border-radius: 12px;
      }

      .sheet {
        max-width: 760px;
        margin: 0 auto;
        border-radius: 14px;
        bottom: 24px;
        left: 24px;
        right: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="loadingOverlay"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; padding: 20px; border-radius: 5px; text-align: center;">
      <h3>正在載入...</h3>
      <div id="progressFill" style="height: 10px; background: #4d7fff; width: 5%;"></div>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <span class="title">🧩 積木程式設計</span>
      <!-- 「看全部」是這一頁在手機上最需要的一顆：一下把整支程式縮到剛好塞滿畫面 -->
      <button class="iconbtn" id="fitBtn" title="看全部（把整支程式縮到剛好塞滿畫面）">⤢ 看全部</button>
      <button class="iconbtn" id="tidyBtn" title="整理積木（排成一直欄）">⇅</button>
      <button class="iconbtn" id="menuBtn" title="更多（存檔、開啟、Plotter）">☰</button>
    </div>

    <div class="canvas-wrap">
      <div id="blocklyDiv"></div>
    </div>

    <!-- 收起時只有一行、顯示最新訊息；點一下展開完整面板。
         錯誤訊息要在編輯時就看得到才有用，所以它必須待在畫面內。 -->
    <button class="status-strip" id="statusStrip" aria-expanded="false" aria-controls="sensorOutput">
      <span>📱</span>
      <span id="statusLatest">準備就緒</span>
      <span class="status-caret">▾</span>
    </button>

    <div id="sensorOutput" hidden>
      <div class="section-title">📱 系統訊息</div>
    </div>

    <div class="bottombar">
      <button class="btn stop" id="resetBtn">⏹️ 停止</button>
      <button class="btn run" id="runBtn">▶️ 執行</button>
    </div>
  </div>

  <div class="scrim" id="drawerScrim" hidden></div>
  <div class="sheet" id="drawer" hidden role="dialog" aria-modal="true" aria-label="更多操作">
    <div class="sheet-head">
      <span class="sheet-title">🎮 程式操作</span>
      <button class="iconbtn" id="drawerCloseBtn" title="關閉">✕</button>
    </div>

    <div class="file-group">
      <span class="file-group-label">ESP32（板子上只存一支，開機自動執行跑這支）</span>
      <button class="btn" id="saveBtn">💾 存到 ESP32</button>
      <button class="btn" id="openFileBtn">📂 從 ESP32 開啟</button>
      <!-- 開機自動執行：原本只在 ai.html。學生在這一頁寫完程式存檔後，若沒有
           跑去另一頁打開這個開關，斷電之後程式就不會自己跑 —— 主端遙控介面的
           按鈕會全部失效，而且很難自己想通原因。放在「存到 ESP32」旁邊才是它
           該在的位置（autorun 跑的就是板子上這一支）。
           兩頁共用同一個 /api/program/autorun 端點，狀態一致。 -->
      <label id="autorunLabel"
             style="display:flex;align-items:center;gap:8px;cursor:pointer;
                    margin-top:10px;font-weight:600;flex-basis:100%;">
        <input type="checkbox" id="autorunToggle" />
        <span>⚡ 開機自動執行</span>
      </label>
      <div id="autorunHint" style="font-size:0.82em;color:#666;margin-top:4px;flex-basis:100%;">
        開啟後，模組一上電就會自動載入並執行已儲存的程式。
      </div>
    </div>

    <div class="file-group">
      <span class="file-group-label">本機（電腦／手機的 .xml 檔，可備份、分享）</span>
      <button class="btn btn-local" id="saveAsNewBtn">⬇️ 下載到本機</button>
      <button class="btn btn-local" id="openLocalBtn">⬆️ 從本機開啟</button>
      <input type="file" id="localFileInput" accept=".xml,application/xml,text/xml" hidden>
    </div>

    <div class="info-section">
      <div class="section-title">📈 Plotter</div>
      <button class="btn" onclick="window.open('plotter.html','phoneBlockyPlotter')">↗ 開啟獨立 Plotter</button>
    </div>

    <div class="info-section">
      <div class="section-title">🏠 離開</div>
      <button id="homeBtn" onclick="resetAndGoHome()" class="btn" style="background: #ee5a52;">🏠 停止程式並回首頁</button>
      <div style="font-size:0.8em;color:#888;margin-top:8px;">v1.3.40 (2026-10-10) — 手機版面（app shell）</div>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="Arduino" colour="120">
      <block type="arduino_setup"></block>
      <block type="arduino_loop"></block>
      <block type="arduino_digitalWrite"></block>
      <block type="arduino_digitalRead"></block>
      <block type="arduino_analogWrite"></block>
      <block type="arduino_analogRead"></block>
      <block type="arduino_delay">
        <value name="DELAY_TIME"><shadow type="math_number"><field name="NUM">1000</field></shadow></value>
      </block>
      <block type="message_print"></block>
      <block type="plot_print"></block>
      <block type="arduino_millis"></block>
    </category>
    <category name="流程控制" colour="210">
      <block type="controls_if"></block>
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number"><field name="NUM">3</field></shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="數學" colour="230">
      <block type="math_number">
        <field name="NUM">0</field>
      </block>
      <block type="math_arithmetic">
        <value name="A"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="B"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="math_abs">
        <value name="VALUE"><shadow type="math_number"><field name="NUM">-5</field></shadow></value>
      </block>
      <block type="math_random_int">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
      <block type="math_constrain">
        <value name="VALUE"><shadow type="math_number"><field name="NUM">50</field></shadow></value>
        <value name="LOW"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="HIGH"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
      <block type="math_map">
        <value name="VALUE"><shadow type="math_number"><field name="NUM">50</field></shadow></value>
        <value name="FROM_LOW"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="FROM_HIGH"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
        <value name="TO_LOW"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
        <value name="TO_HIGH"><shadow type="math_number"><field name="NUM">180</field></shadow></value>
      </block>
    </category>
    <category name="邏輯" colour="210">
      <block type="logic_boolean"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
    </category>
    <category name="變數" colour="330" custom="VARIABLE"></category>
    <category name="感測器" colour="390">
      <block type="arduino_ultrasonic"></block>
      <block type="lego_button"></block>
    </category>
    <category name="對外功能" colour="60">
      <block type="blockly_func_declare"></block>
      <block type="blockly_func_get"></block>
      <block type="blockly_func_set"></block>
    </category>
    <category name="馬達模組" colour="290">
      <block type="motor_pwm">
        <value name="PWM"><shadow type="math_number"><field name="NUM">50</field></shadow></value>
      </block>
      <block type="motor_stop"></block>
      <block type="motor_speed">
        <value name="RPM"><shadow type="math_number"><field name="NUM">120</field></shadow></value>
      </block>
      <block type="motor_zero"></block>
      <block type="motor_position">
        <value name="DEG"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
      </block>
      <block type="motor_move_by">
        <value name="DEG"><shadow type="math_number"><field name="NUM">90</field></shadow></value>
      </block>
      <block type="servo_set">
        <value name="DEG"><shadow type="math_number"><field name="NUM">90</field></shadow></value>
      </block>
    </category>
    <!-- 內容由 app.js 的 subroutineFlyout() 動態產生：定義積木 + 目前每個副程式的呼叫積木 -->
    <category name="副程式" colour="290" custom="SUBROUTINE"></category>
  </xml>

  <script>
    if (typeof Blockly !== 'undefined') {
      Blockly.Msg["VARIABLES_SET"] = "設定 %1 為 %2";
      Blockly.Msg["MATH_CHANGE_TITLE"] = "將 %1 增加 %2";
      Blockly.Msg["DUPLICATE_BLOCK"] = "複製積木";
      Blockly.Msg["DELETE_BLOCK"] = "刪除積木";
      Blockly.Msg["CLEAN_UP"] = "整理積木";
      // 副程式（Blockly 內建 procedures 積木）中文化
      Blockly.Msg["PROCEDURES_DEFNORETURN_TITLE"] = "副程式";
      Blockly.Msg["PROCEDURES_DEFNORETURN_PROCEDURE"] = "我的副程式";
      Blockly.Msg["PROCEDURES_DEFNORETURN_TOOLTIP"] = "把一段積木包成副程式，之後用「呼叫」積木重複使用。可在齒輪裡加參數。";
      Blockly.Msg["PROCEDURES_DEFNORETURN_COMMENT"] = "";
      Blockly.Msg["PROCEDURES_BEFORE_PARAMS"] = "參數：";
      Blockly.Msg["PROCEDURES_CALL_BEFORE_PARAMS"] = "參數：";
      Blockly.Msg["PROCEDURES_CALLNORETURN_TOOLTIP"] = "執行副程式「%1」";
      Blockly.Msg["PROCEDURES_MUTATORCONTAINER_TITLE"] = "參數";
      Blockly.Msg["PROCEDURES_MUTATORCONTAINER_TOOLTIP"] = "新增、移除或調整參數順序";
      Blockly.Msg["PROCEDURES_MUTATORARG_TITLE"] = "參數名稱：";
      Blockly.Msg["PROCEDURES_MUTATORARG_TOOLTIP"] = "新增一個參數";
      Blockly.Msg["PROCEDURES_CREATE_DO"] = "建立「%1」的呼叫積木";
      Blockly.Msg["PROCEDURES_HIGHLIGHT_DEF"] = "找到副程式定義";
      Blockly.Msg["PROCEDURES_DEF_DUPLICATE_WARNING"] = "已經有同名的副程式了";
      Blockly.Msg["PROCEDURES_CALL_DISABLED_DEF_WARNING"] = "這個副程式已被停用，無法呼叫";

      if (Blockly.Workspace && Blockly.Workspace.prototype) {
        Blockly.Workspace.prototype.getVariable = function (name, type) {
          return this.getVariableMap().getVariable(name, type);
        };
        Blockly.Workspace.prototype.getAllVariables = function () {
          return this.getVariableMap().getAllVariables();
        };
      }
    }

    (function () {
      let p = 5;
      const fill = document.getElementById('progressFill');
      const interval = setInterval(() => {
        p += 20;
        if (fill) fill.style.width = p + '%';
        if (p >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            // 遮罩移除後版面才真正定位，重新整理 Blockly 座標快取避免點擊跳位
            if (typeof Blockly !== 'undefined' && typeof workspace !== 'undefined' && workspace) {
              Blockly.svgResize(workspace);
            }
          }, 300);
        }
      }, 100);
    })();
  </script>
</body>

</html>
