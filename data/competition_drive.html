<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相撲車控制</title>
<style>body{font-family:system-ui;max-width:700px;margin:auto;padding:20px;background:#101827;color:#e9f0fa}section{background:#1b273b;padding:20px;border-radius:12px;margin:18px 0}input,button,select{font:inherit;padding:10px;max-width:100%}button{border:0;border-radius:8px;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pad button{min-height:80px;touch-action:none;user-select:none;background:#3e5779;color:white;font-size:1.3rem}.danger{background:#b72b3c!important;color:white}label{display:block;margin:10px 0}a{color:#90d3ff}#status{font-size:1.4rem}#notice{color:#ffd37c;white-space:pre-wrap}.muted{font-size:.9rem;color:#bdc8d9}</style></head><body>
<h1>相撲車控制</h1><p id="status">連線中…</p><p id="notice" role="alert"></p>
<section><label>本車密碼 <input id="key" type="password" autocomplete="current-password"></label><button id="login">登入並取得操控權</button><p class="muted">密碼由 USB 配對工具提供。裁判未授權時，操作不會讓車動作。</p></section>
<section><label>左輪 <select id="left"><option>1</option><option>2</option><option>3</option><option>4</option></select> <input id="invertLeft" type="checkbox">反轉</label><label>右輪 <select id="right"><option>2</option><option>1</option><option>3</option><option>4</option></select> <input id="invertRight" type="checkbox">反轉</label><label>動力 <input id="power" type="range" min="10" max="100" value="50"><output id="powerValue">50%</output></label>
<div class="pad"><span></span><button data-move="forward">前進</button><span></span><button data-move="left">左轉</button><button id="neutral">放開／停止輪子</button><button data-move="right">右轉</button><span></span><button data-move="back">後退</button><span></span></div><p class="muted">按住才行駛，放開停止。失去手動授權、換段或切換分頁後，需要重新按下；不會延續先前操作。</p><button id="emergency" class="danger">停止本車並回報裁判故障</button></section>
<section><h2>自動程式</h2><p>登入後開啟 <a href="blockly.html">Blockly 編輯器</a>，使用「儲存到 ESP32」。自動程式由裁判啟動；本頁不提供直接執行。</p><p class="muted">裁判準備後程式會鎖定。自動階段恢復時從 setup 重跑，剩餘比賽時間不增加。</p></section>
<script src="competition_drive.js?v=1"></script></body></html>
