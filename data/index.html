<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>🎮 ESP32 機器人控制中心</title>
  <!-- 不鎖縮放：這一頁沒有會被縮放弄壞的版面，鎖住只會讓看不清楚的人沒辦法放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ========================================================================
       首頁＝手機桌面：六個方塊磁貼，整塊都可以點。
       原本是六顆橫向長條按鈕，一顆佔滿整行，手機上要捲動才看得完，
       而且「可點的範圍」其實只有那一條。改成方塊之後，一眼看得到全部，
       每個目標也大得多（最小邊約 140px，遠超過觸控目標 44px 的下限）。
       ===================================================================== */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #4d7fff 100%);
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      /* iPhone 瀏海與底部手勢區 */
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      width: 100%;
      /* 三欄排滿就夠寬了，再寬只會讓磁貼之間離得很遠 */
      max-width: 560px;
    }

    h2 {
      margin: 4px 0 20px;
      background: linear-gradient(45deg, #667eea, #4d7fff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      font-size: 1.6em;
      font-weight: 600;
    }

    /* 手機（約 390px 寬）剛好兩欄；平板與桌機自動變三欄。
       用 auto-fit + minmax 讓欄數跟著寬度走，不必用 JS 偵測裝置。 */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* 正方形比較像手機桌面；aspect-ratio 太舊的瀏覽器不支援，min-height 是後路 */
      aspect-ratio: 1 / 1;
      min-height: 130px;
      padding: 10px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e8ebf5;
      box-shadow: 0 2px 8px rgba(60, 80, 180, 0.08);
      color: #333;
      text-decoration: none;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
    }

    /* 按下去要有反應，手機上沒有 hover 可以依賴 */
    .tile:active {
      transform: scale(0.96);
      box-shadow: 0 1px 4px rgba(60, 80, 180, 0.12);
    }

    @media (hover: hover) {
      .tile:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(60, 80, 180, 0.18);
      }
    }

    /* 圖示用各自的顏色，掃一眼就能分辨，不必真的讀完字 */
    .tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--accent, #4d7fff);
      font-size: 1.7em;
      line-height: 1;
    }

    .tile-name {
      font-size: 1em;
      font-weight: 600;
    }

    .tile-sub {
      font-size: 0.75em;
      color: #7a8194;
      line-height: 1.3;
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 16px 12px;
        border-radius: 14px;
      }

      /* 很窄的螢幕仍維持兩欄：一欄會變回「要捲動才看得完」的老問題 */
      .tiles {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .tile {
        min-height: 112px;
        border-radius: 15px;
      }

      .tile-icon {
        width: 46px;
        height: 46px;
        font-size: 1.5em;
      }

      .tile-name {
        font-size: 0.9em;
      }

      .tile-sub {
        display: none;      /* 擠不下時先捨棄說明，保留圖示與名稱 */
      }
    }

    @media (min-width: 700px) {
      h2 {
        font-size: 2.1em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🎮 機器人控制器</h2>
    <!-- 用 <a> 而不是 button + location.href：整塊都是連結、可長按另開分頁，
         而且沒有 JavaScript 也能用。 -->
    <div class="tiles">
      <a class="tile" href="blockly.html">
        <span class="tile-icon" style="--accent:#e7efff">🧩</span>
        <span class="tile-name">積木程式</span>
        <span class="tile-sub">拖積木寫程式</span>
      </a>
      <a class="tile" href="ai.html">
        <span class="tile-icon" style="--accent:#efe7ff">🤖</span>
        <span class="tile-name">AI 生成</span>
        <span class="tile-sub">講一句話產生程式</span>
      </a>
      <a class="tile" href="joy.html">
        <span class="tile-icon" style="--accent:#e7fff2">🕹️</span>
        <span class="tile-name">虛擬搖桿</span>
        <span class="tile-sub">即時手動操作</span>
      </a>
      <a class="tile" href="hardware_test.html">
        <span class="tile-icon" style="--accent:#fff2e0">🔧</span>
        <span class="tile-name">硬體檢測</span>
        <span class="tile-sub">馬達舵機一鍵測</span>
      </a>
      <a class="tile" href="set.html">
        <span class="tile-icon" style="--accent:#e0f4ff">📶</span>
        <span class="tile-name">相關設定</span>
        <span class="tile-sub">WiFi、PID 參數</span>
      </a>
      <a class="tile" href="wiring.html">
        <span class="tile-icon" style="--accent:#ffe7ef">🔌</span>
        <span class="tile-name">接線說明</span>
        <span class="tile-sub">腳位對照圖</span>
      </a>
    </div>
  </div>
</body>

</html>
