<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>🎮 ESP32 機器人控制中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #4d7fff 100%);
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      position: relative;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 48px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      text-align: center;
      min-width: 320px;
      max-width: min(95vw, 600px);
      width: 100%;
      margin: 0 auto;
      position: relative;
      transform-origin: center;
      transition: transform 0.2s ease-out;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 32px;
      background: linear-gradient(45deg, #667eea, #4d7fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      font-size: 2.5em;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 24px;
      align-items: center;
    }

    .menu-btn {
      background: linear-gradient(45deg, #667eea, #4d7fff);
      color: #fff;
      border: none;
      border-radius: 15px;
      padding: 18px 36px;
      font-size: 1.2em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(60, 80, 180, 0.08);
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    .menu-btn:hover {
      background: linear-gradient(45deg, #4d7fff, #667eea);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      transform: translateY(-3px);
    }

    .menu-btn:active {
      transform: translateY(-1px);
    }

    /* 縮放適配 */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 20px 5vw;
        min-width: unset;
        border-radius: 15px;
        max-width: 100%;
      }

      .container:hover {
        transform: scale(1.01);
      }

      h2 {
        font-size: 1.5em;
        margin-bottom: 20px;
      }

      .menu-btn {
        font-size: 1em;
        padding: 16px 20px;
        max-width: 100%;
      }

      .btn-group {
        gap: 16px;
      }
    }

    /* 超小螢幕優化 */
    @media (max-width: 360px) {
      body {
        padding: 5px;
      }

      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h2 {
        font-size: 1.3em;
      }
    }

    /* 大螢幕優化 */
    @media (min-width: 1200px) {
      .container {
        max-width: 500px;
        padding: 50px 60px;
      }

      h2 {
        font-size: 3em;
      }

      .menu-btn {
        font-size: 1.3em;
        padding: 20px 40px;
      }
    }

    /* 強制移動設備樣式 */
    body.mobile-device {
      padding: 8px !important;
    }

    body.mobile-device .container {
      padding: 16px !important;
      max-width: 100% !important;
      min-width: unset !important;
      border-radius: 12px !important;
      transform: none !important;
    }

    body.mobile-device .container:hover {
      transform: none !important;
    }

    body.mobile-device h2 {
      font-size: 1.4em !important;
      margin-bottom: 16px !important;
    }

    body.mobile-device .menu-btn {
      font-size: 0.95em !important;
      padding: 14px 18px !important;
      max-width: 100% !important;
    }

    body.mobile-device .btn-group {
      gap: 12px !important;
    }
  </style>
  <script>
    // 強制移動設備檢測和佈局調整
    function detectMobileAndAdjust() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
        window.screen.width <= 768 ||
        window.innerWidth <= 768 ||
        ('ontouchstart' in window);

      if (isMobile) {
        if (document.body) {
          document.body.classList.add('mobile-device');
        }
        // 強制設置viewport
        const viewport = document.querySelector('meta[name=viewport]');
        if (viewport) {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }
      }
    }

    // 當 DOM 載入完成後執行
    document.addEventListener('DOMContentLoaded', detectMobileAndAdjust);

    // 當頁面完全載入後再次檢測（包含圖片等資源）
    window.addEventListener('load', detectMobileAndAdjust);
    window.addEventListener('resize', detectMobileAndAdjust);
  </script>
</head>

<body>
  <div class="container">
    <h2>🎮 機器人控制器</h2>
    <div class="btn-group">
      <button class="menu-btn" onclick="location.href='blockly.html'">🧩 Blockly 程式積木</button>
      <button class="menu-btn" onclick="location.href='ai.html'">🤖 AI 生成程式</button>
      <button class="menu-btn" onclick="location.href='joy.html'">🕹️ 虛擬搖桿控制</button>
      <button class="menu-btn" onclick="location.href='hardware_test.html'">🔧 硬體功能檢測</button>
      <button class="menu-btn" onclick="location.href='set.html'">📶 相關設定</button>
      <button class="menu-btn" onclick="location.href='wiring.html'">🔌 接線說明</button>
    </div>
  </div>
</body>

</html>
