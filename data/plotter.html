<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>phone_blocky Plotter</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0e1b2c;--line:#22344b;--muted:#8da2b9;--blue:#4d7fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172d50 0,transparent 34%),var(--bg);color:#edf5ff;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}
    header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #20344c;background:rgba(8,18,32,.88);backdrop-filter:blur(12px)}
    .brand{margin-right:auto}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted);margin-top:3px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .btn,select{border:1px solid #34506f;border-radius:9px;padding:8px 13px;background:#152940;color:#eef6ff;font-weight:600}.btn{cursor:pointer}.btn:hover{background:#1d3a5d}.btn.primary{background:var(--blue);border-color:var(--blue)}
    .status{display:inline-flex;align-items:center;gap:7px;color:#ffca6a;font-size:13px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.status.on{color:#5ce0a1}
    main{height:calc(100vh - 76px);padding:16px;display:grid;grid-template-rows:auto minmax(300px,1fr);gap:12px}.summary{display:flex;gap:10px;overflow-x:auto;min-height:69px}.empty-card{color:var(--muted);padding:18px}
    .metric{min-width:170px;padding:11px 14px;border:1px solid #243b57;border-radius:12px;background:linear-gradient(145deg,#12243a,#0d1929);box-shadow:0 8px 24px #0004}.metric-name{font-size:12px;color:var(--muted)}.metric-value{font-size:25px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}
    .chart-shell{position:relative;min-height:0;padding:10px;border:1px solid #203650;border-radius:15px;background:linear-gradient(160deg,#0e1b2c,#091421);box-shadow:0 16px 50px #0006}canvas{width:100%;height:100%;display:block}
    .axis-title{position:absolute;color:#6f879f;font-size:11px;pointer-events:none}.axis-title.y{left:15px;top:13px}.axis-title.x{right:18px;bottom:12px}
    @media(max-width:720px){header{align-items:flex-start;padding:12px;flex-direction:column}.brand{margin:0}.controls{width:100%}main{height:calc(100vh - 150px);padding:8px}.status{margin-left:auto}.metric{min-width:145px}.chart-shell{padding:4px}}
  </style>
</head>
<body>
  <header><div class="brand"><h1>📈 即時資料 Plotter</h1><small>phone_blocky · Blockly 繪圖輸出</small></div><div class="controls"><span id="status" class="status">連線中…</span><button id="pause" class="btn primary">暫停</button><button id="clear" class="btn">清除</button><label>時間窗 <select id="window"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option></select></label></div></header>
  <main><section id="summary" class="summary"><div class="empty-card">尚未收到繪圖資料</div></section><section class="chart-shell"><span class="axis-title y">數值</span><canvas id="chart"></canvas><span class="axis-title x">時間</span></section></main>
  <script>
    const state={series:{},paused:false,windowMs:30000,colors:['#55c7ff','#ffd05a','#ff6685','#65dfa4','#bd86ff','#ff8b5c','#3de2da','#ff76c7']};
    const summary=document.getElementById('summary');
    function add(d){if(state.paused||d.type!=='plot'||typeof d.series!=='string')return;const v=Number(d.value);if(!Number.isFinite(v)||v<0)return;const name=d.unit?`${d.series} (${d.unit})`:d.series,a=state.series[name]||(state.series[name]=[]),now=Date.now();a.push({t:now,v});trim(now);draw()}
    function trim(now=Date.now()){Object.values(state.series).forEach(a=>{while(a.length&&a[0].t<now-state.windowMs)a.shift()})}
    function nice(v){const a=Math.abs(v);return a>=1000?v.toFixed(0):a>=10?v.toFixed(1):v.toFixed(2)}
    function draw(){trim();const c=document.getElementById('chart'),d=devicePixelRatio||1,r=c.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);c.width=Math.round(w*d);c.height=Math.round(h*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);const entries=Object.entries(state.series).filter(([,a])=>a.length),all=entries.flatMap(([,a])=>a);summary.innerHTML=entries.length?entries.map(([n,a],i)=>`<article class="metric"><div class="metric-name"><span style="color:${state.colors[i%state.colors.length]}">●</span> ${n}</div><div class="metric-value">${nice(a[a.length-1].v)}</div></article>`).join(''):'<div class="empty-card">尚未收到「繪圖」積木資料</div>';const L=58,R=18,T=28,B=45;if(!all.length){x.fillStyle='#8da2b9';x.font='15px system-ui';x.textAlign='center';x.fillText('等待「繪圖」積木的數值資料…',w/2,h/2);return}let lo=Math.min(...all.map(p=>p.v)),hi=Math.max(...all.map(p=>p.v)),span=hi-lo;if(span===0){span=Math.max(2,Math.abs(hi)*.1);lo-=span/2;hi+=span/2}else{lo-=span*.1;hi+=span*.1}x.font='11px system-ui';x.lineWidth=1;for(let i=0;i<=5;i++){const y=T+(h-T-B)*i/5,val=hi-(hi-lo)*i/5;x.strokeStyle='#22344b';x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#8da2b9';x.textAlign='right';x.fillText(nice(val),L-9,y+4)}const end=Date.now(),start=end-state.windowMs;for(let i=0;i<=6;i++){const px=L+(w-L-R)*i/6,seconds=-state.windowMs/1000*(1-i/6);x.strokeStyle='#192b40';x.beginPath();x.moveTo(px,T);x.lineTo(px,h-B);x.stroke();x.fillStyle='#8da2b9';x.textAlign=i===0?'left':i===6?'right':'center';x.fillText(i===6?'現在':`${Math.round(seconds)}s`,px,h-B+20)}entries.forEach(([n,a],j)=>{x.strokeStyle=state.colors[j%state.colors.length];x.lineWidth=2.5;x.lineJoin='round';x.beginPath();a.forEach((p,i)=>{const px=L+(w-L-R)*(p.t-start)/state.windowMs,py=h-B-(p.v-lo)/(hi-lo)*(h-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();const p=a[a.length-1],px=L+(w-L-R)*(p.t-start)/state.windowMs,py=h-B-(p.v-lo)/(hi-lo)*(h-T-B);x.fillStyle=x.strokeStyle;x.beginPath();x.arc(px,py,3.5,0,Math.PI*2);x.fill()})}
    const statusEl=document.getElementById('status');let ws,timer;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{statusEl.textContent='已連線';statusEl.className='status on'};ws.onmessage=e=>{try{add(JSON.parse(e.data))}catch(_){}};ws.onclose=()=>{statusEl.textContent='正在重連…';statusEl.className='status';setTimeout(connect,2000)};ws.onerror=()=>ws.close()}
    document.getElementById('pause').onclick=e=>{state.paused=!state.paused;e.target.textContent=state.paused?'繼續':'暫停';e.target.classList.toggle('primary',!state.paused)};document.getElementById('clear').onclick=()=>{state.series={};draw()};document.getElementById('window').onchange=e=>{state.windowMs=Number(e.target.value)*1000;draw()};window.onresize=draw;timer=setInterval(draw,1000);draw();connect();
  </script>
</body></html>
