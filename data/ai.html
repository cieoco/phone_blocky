<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <title>🤖 AI 生成程式</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #4d7fff 100%);
      min-height: 100vh;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .main-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
      backdrop-filter: blur(10px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header h1 {
      margin: 0;
      font-size: 2em;
      background: linear-gradient(45deg, #667eea, #4d7fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: #666; margin: 6px 0 0 0; font-size: 0.95em; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .home-button {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      color: white; border: none; padding: 10px 20px; border-radius: 25px;
      cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }
    .estop-button {
      background: #d7263d; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 800;
      box-shadow: 0 6px 18px rgba(215, 38, 61, 0.35);
    }

    .section {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      padding: 20px;
      margin: 15px 0;
    }
    .section-title {
      color: #333; font-size: 1.1em; font-weight: 600;
      border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px;
    }

    label { display: block; font-size: 0.9em; color: #555; margin-bottom: 6px; font-weight: 600; }
    textarea, input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; border: 1px solid #d8dde8; border-radius: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.95em;
      box-sizing: border-box; resize: vertical;
    }
    textarea#promptInput { min-height: 90px; }
    textarea#jsonOutput { min-height: 220px; font-family: 'Consolas','Courier New',monospace; font-size: 0.85em; }
    input[type="password"]#azureApiKey,
    input[type="text"]#azureEndpoint,
    input[type="text"]#azureDeployment { font-family: 'Consolas','Courier New',monospace; font-size: 0.85em; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row > * { flex: 0 0 auto; }
    .row .grow { flex: 1 1 200px; }

    .btn {
      border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer;
      font-weight: 700; font-size: 0.95em; transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(45deg, #667eea, #4d7fff); color: white; box-shadow: 0 4px 12px rgba(77,127,255,0.3); }
    .btn-success { background: linear-gradient(45deg, #4ecdc4, #44a08d); color: white; box-shadow: 0 4px 12px rgba(78,205,196,0.3); }
    .btn-secondary { background: #eef0f5; color: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status-line {
      font-size: 0.85em; padding: 8px 12px; border-radius: 8px; margin-top: 10px;
      font-family: 'Consolas','Courier New',monospace; word-break: break-word;
    }
    .status-info  { background: #eef2ff; color: #3949ab; }
    .status-ok    { background: #e7f7ee; color: #1e7a3a; }
    .status-warn  { background: #fff5e6; color: #b76b00; }
    .status-error { background: #fde8ea; color: #b3261e; }

    .ws-pill {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 0.8em; font-weight: 700;
    }
    .ws-on  { background: #e7f7ee; color: #1e7a3a; }
    .ws-off { background: #fde8ea; color: #b3261e; }

    .example-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      background: #f1f3fb; color: #4252b8;
      padding: 5px 10px; border-radius: 16px; cursor: pointer;
      font-size: 0.8em; border: 1px solid #dde2f3;
    }
    .chip:hover { background: #e6e9fa; }

    .mode-toggle {
      display: inline-flex; gap: 2px; background: #eef0f5; padding: 2px;
      border-radius: 10px;
    }
    .mode-toggle .mode-opt {
      padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8em;
      user-select: none;
    }
    .mode-toggle .mode-opt.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.08); font-weight: 700; }

    .hint { font-size: 0.78em; color: #888; margin-top: 4px; }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="header">
      <div>
        <h1>🤖 AI 生成程式</h1>
        <p>用自然語言描述動作 → AI 產生 PROG JSON → 透過 WebSocket 執行</p>
      </div>
      <div class="header-actions">
        <button class="estop-button" onclick="emergencyStop()">緊急停止</button>
        <button class="home-button" onclick="location.href='index.html'">🏠 回首頁</button>
      </div>
    </div>

    <!-- 1. Azure OpenAI 設定 -->
    <div class="section">
      <div class="section-title">⚙️ 設定</div>
      <div class="row" style="margin-bottom:10px;">
        <div class="grow">
          <label for="azureEndpoint">Azure OpenAI Endpoint</label>
          <input type="text" id="azureEndpoint" placeholder="https://你的資源名稱.openai.azure.com/" autocomplete="off" />
        </div>
        <div class="grow">
          <label for="azureDeployment">Deployment 名稱</label>
          <input type="text" id="azureDeployment" placeholder="例如: gpt-4o" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <div class="grow">
          <label for="azureApiKey">API Key</label>
          <input type="password" id="azureApiKey" placeholder="你的 Azure OpenAI API Key" autocomplete="off" />
          <div class="hint">設定存在瀏覽器 localStorage，不會傳送到 ESP32</div>
        </div>
        <div>
          <label>來源</label>
          <div class="mode-toggle" id="sourceToggle">
            <div class="mode-opt active" data-source="azure" onclick="setSource('azure')">Azure OpenAI</div>
            <div class="mode-opt" data-source="mock" onclick="setSource('mock')">Mock（離線）</div>
          </div>
          <div class="hint">未設定時用 Mock 預覽</div>
        </div>
      </div>
    </div>

    <!-- 2. Prompt 輸入 -->
    <div class="section">
      <div class="section-title">📝 自然語言需求</div>
      <textarea id="promptInput" placeholder="例如:讓馬達 1 前進 2 秒後停止"></textarea>
      <div class="example-chips">
        <span class="chip" onclick="setPrompt('讓馬達 1 前進 2 秒後停止')">馬達 1 前進 2 秒</span>
        <span class="chip" onclick="setPrompt('夾爪每秒開合一次,開 47 度合 138 度')">夾爪每秒開合</span>
        <span class="chip" onclick="setPrompt('馬達 3 正轉、馬達 4 反轉,三秒後都停')">M3/M4 反向轉</span>
        <span class="chip" onclick="setPrompt('舵機 1 從 0 度慢慢轉到 180 度再回來')">舵機掃描</span>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="genBtn" class="btn btn-primary" onclick="generate()">🪄 產生 JSON</button>
        <span id="genStatus" class="hint"></span>
      </div>
    </div>

    <!-- 3. JSON 結果 + 執行 -->
    <div class="section">
      <div class="section-title">📦 PROG JSON</div>
      <textarea id="jsonOutput" placeholder='AI 產生的 JSON 會出現在這裡,你可以手動修改後再執行'></textarea>
      <div id="validateStatus" class="status-line status-info" style="display:none;"></div>
      <div class="row" style="margin-top: 12px;">
        <button class="btn btn-secondary" onclick="validateJson()">✓ 驗證</button>
        <button class="btn btn-secondary" onclick="copyJson()">📋 複製</button>
        <button class="btn btn-secondary" onclick="clearJson()">🗑 清空</button>
        <span class="grow"></span>
        <span>WebSocket: <span id="wsPill" class="ws-pill ws-off">未連線</span></span>
        <button class="btn" style="background:#e67e22;color:white;" onclick="stopProgram()">⏹ 停止程式</button>
        <button id="runBtn" class="btn btn-success" onclick="runProgram()">▶ 執行到 ESP32</button>
      </div>
    </div>

    <!-- 3.5. ESP32 持久化(LittleFS) -->
    <div class="section">
      <div class="section-title">💾 ESP32 存檔 (LittleFS，與 Blockly 共用)</div>
      <div class="row">
        <button class="btn btn-primary" onclick="saveToEsp32()">💾 存入 ESP32</button>
        <button class="btn btn-secondary" onclick="loadFromEsp32()">📥 載入 ESP32</button>
        <button class="btn btn-secondary" onclick="deleteEsp32()">🗑 刪除 ESP32 存檔</button>
        <span class="grow"></span>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;margin:0;">
          <input type="checkbox" id="autorunToggle" onchange="onAutorunToggle(this.checked)" />
          開機自動執行
        </label>
      </div>
      <div id="storeStatus" class="status-line status-info" style="display:none;margin-top:10px;"></div>
    </div>

    <!-- 4. Log -->
    <div class="section">
      <div class="section-title">📜 動作紀錄</div>
      <div id="log" style="font-family: 'Consolas','Courier New',monospace; font-size: 0.8em; color:#444; max-height: 200px; overflow-y: auto; white-space: pre-wrap;"></div>
    </div>
  </div>

  <script>
    // ---------- 常數 ----------
    const LS_ENDPOINT   = 'phone_blocky.ai.azureEndpoint';
    const LS_APIKEY     = 'phone_blocky.ai.azureApiKey';
    const LS_DEPLOYMENT = 'phone_blocky.ai.azureDeployment';
    const LS_SOURCE     = 'phone_blocky.ai.source';
    const AZURE_API_VERSION = '2024-08-01-preview';

    const SYSTEM_PROMPT = "你是 phone_blocky JSON generator。\n\n你的工作:把使用者的自然語言需求轉成 phone_blocky 的 PROG JSON 程式。\n\n# 嚴格規則\n1. 只能輸出 JSON,不要任何 Markdown 標記、註解、解釋文字\n2. 頂層格式必須是: {\"mode\":\"PROG\",\"setup\":[...],\"loop\":[...]}\n3. setup 與 loop 都是指令陣列,可空但必須存在\n\n# 可用指令\n\n動作指令 (用 \"cmd\" key):\n- {\"cmd\":\"pwm\",\"motor\":<1-4>,\"duty\":<-100..100>}\n    馬達 PWM 直接驅動。duty 正數正轉、負數反轉、0 停止\n- {\"cmd\":\"stop\",\"motor\":<0-4>}\n    停止馬達。motor=0 或省略代表停全部\n- {\"cmd\":\"servo\",\"ch\":<1-2>,\"deg\":<0..180>}\n    舵機轉到指定角度\n- {\"cmd\":\"delay\",\"ms\":<0..10000>}\n    等待毫秒數\n\n- {\"cmd\":\"move_to\",\"motor\":<3|4>,\"deg\":<整數>}\n- {\"cmd\":\"move_by\",\"motor\":<3|4>,\"deg\":<整數>}\n    絕對／相對角度，deg 是度×100（90°=9000）。非阻塞，到位後保持；stop 解除保持。\n- {\"cmd\":\"zero\",\"motor\":<3|4>}\n    把目前位置設為零點，只在使用者要求歸零時加入。\n- {\"cmd\":\"speed\",\"motor\":<3|4>,\"rpm\":<0 或 60..250>}\n    閉迴路 RPM；0 停止。M1/M2 不支援 speed、move_to、move_by、zero。\n\n條件分支 (沿用 Blockly 形狀,用 \"command\" key):\n- {\"command\":\"if\",\n   \"condition\":{\n     \"command\":\"logic_compare\",\n     \"operator\":\"LT|GT|EQ|NEQ|LTE|GTE\",\n     \"left\":  <感測器讀值 或 整數>,\n     \"right\": <感測器讀值 或 整數>\n   },\n   \"then\":[<指令...>],\n   \"else\":[<指令...>]}\n\n感測器讀值 (只能放在 condition.left / condition.right):\n- {\"command\":\"arduinoUltrasonic\",\"trigPin\":\"<0-39>\",\"echoPin\":\"<0-39>\"}\n    讀超音波距離 (cm)。**腳位用字串,對齊 Blockly 既有格式**\n\n- {\"command\":\"legoButton\",\"pin\":\"4\"}\n    讀取原始數位電位 0/1（INPUT_PULLUP）；按下對應值取決於接線，不自行假定。\n\n# 形狀重點 (重要!)\n- 不支援 while、until、repeat；持續判斷使用頂層 loop + if，不生成巢狀迴圈。\n- 指令總數（含 then/else）最多 64。\n- 超音波 timeout 回 -1，涉及距離門檻時應考慮無回波情況。\n- 動作指令用 `cmd:`、條件分支與感測器用 `command:` —— 不要混用\n- if 用 Blockly 既有的 condition + logic_compare 雙層巢狀,不要扁平化\n- operator 用 Blockly 字串代號:\n    LT  = less than (<)\n    GT  = greater than (>)\n    EQ  = equal (==)\n    NEQ = not equal (!=)\n    LTE = less than or equal (<=)\n    GTE = greater than or equal (>=)\n\n# 硬體限制\n- 馬達編號 1-4 (M1-M4)\n- 舵機通道 1-2,角度 0-180\n- 單個 delay 上限 10 秒;需要更久請拆多個\n- 超音波預設腳位 trigPin=\"2\" echoPin=\"33\" (使用者沒指定就用這組)\n\n# 動作分配的習慣\n- 一次性動作 → 全部放 setup，loop 留空；需要停止時最後加 stop。loop 永遠重複，stop 只停馬達、不會結束程式。\n- 週期性動作 → 放 loop 讓它循環\n- 初始化動作 → 放 setup\n- 感測器條件式 → 把整個 if 放 loop，每次輪到該 if 時重新讀感測器再判斷；每個 tick 只執行一條頂層指令\n- 條件式後面加一個 100-200ms delay,避免無限空轉\n\n# 範例\n使用者: 讓馬達 1 前進 2 秒後停止\n回應:\n{\"mode\":\"PROG\",\"setup\":[{\"cmd\":\"pwm\",\"motor\":1,\"duty\":60},{\"cmd\":\"delay\",\"ms\":2000},{\"cmd\":\"stop\",\"motor\":1}],\"loop\":[]}\n\n使用者: 夾爪每秒開合一次\n回應:\n{\"mode\":\"PROG\",\"setup\":[{\"cmd\":\"servo\",\"ch\":1,\"deg\":47}],\"loop\":[{\"cmd\":\"servo\",\"ch\":1,\"deg\":138},{\"cmd\":\"delay\",\"ms\":1000},{\"cmd\":\"servo\",\"ch\":1,\"deg\":47},{\"cmd\":\"delay\",\"ms\":1000}]}\n\n使用者: 馬達 3 正轉、馬達 4 反轉,然後三秒後都停\n回應:\n{\"mode\":\"PROG\",\"setup\":[{\"cmd\":\"pwm\",\"motor\":3,\"duty\":70},{\"cmd\":\"pwm\",\"motor\":4,\"duty\":-70},{\"cmd\":\"delay\",\"ms\":3000},{\"cmd\":\"stop\"}],\"loop\":[]}\n\n使用者: 如果超音波低於 20 公分就讓馬達 1 停,否則讓馬達 1 前進\n回應:\n{\"mode\":\"PROG\",\"setup\":[],\"loop\":[{\"command\":\"if\",\"condition\":{\"command\":\"logic_compare\",\"operator\":\"LT\",\"left\":{\"command\":\"arduinoUltrasonic\",\"trigPin\":\"2\",\"echoPin\":\"33\"},\"right\":20},\"then\":[{\"cmd\":\"stop\",\"motor\":1}],\"else\":[{\"cmd\":\"pwm\",\"motor\":1,\"duty\":60}]},{\"cmd\":\"delay\",\"ms\":100}]}\n\n使用者: 超音波超過 30 公分時讓 M3 正轉,持續判斷\n回應:\n{\"mode\":\"PROG\",\"setup\":[],\"loop\":[{\"command\":\"if\",\"condition\":{\"command\":\"logic_compare\",\"operator\":\"GT\",\"left\":{\"command\":\"arduinoUltrasonic\",\"trigPin\":\"2\",\"echoPin\":\"33\"},\"right\":30},\"then\":[{\"cmd\":\"pwm\",\"motor\":3,\"duty\":70}],\"else\":[{\"cmd\":\"stop\",\"motor\":3}]},{\"cmd\":\"delay\",\"ms\":100}]}\n\n如果使用者的需求不合理 (例如指定不存在的馬達、超出範圍、語意不明),回傳一個空程式: {\"mode\":\"PROG\",\"setup\":[],\"loop\":[]}\n";

    // ---------- 狀態 ----------
    let source = localStorage.getItem(LS_SOURCE) || 'azure';
    let websocket = null;
    const ALLOWED_CMDS = ['pwm', 'stop', 'servo', 'delay', 'move_to', 'move_by', 'speed', 'zero'];
    const ALLOWED_BLOCKLY_CMDS = ['if'];
    const ALLOWED_READ_CMDS = ['arduinoUltrasonic', 'legoButton'];
    const ALLOWED_OPS = ['LT', 'GT', 'EQ', 'NEQ', 'LTE', 'GTE'];
    const MAX_COMMANDS = 64;

    // ---------- 初始化 ----------
    window.addEventListener('load', () => {
      document.getElementById('azureEndpoint').value   = localStorage.getItem(LS_ENDPOINT)   || '';
      document.getElementById('azureApiKey').value     = localStorage.getItem(LS_APIKEY)     || '';
      document.getElementById('azureDeployment').value = localStorage.getItem(LS_DEPLOYMENT) || '';
      document.getElementById('azureEndpoint').addEventListener('input',   e => localStorage.setItem(LS_ENDPOINT,   e.target.value.trim()));
      document.getElementById('azureApiKey').addEventListener('input',     e => localStorage.setItem(LS_APIKEY,     e.target.value.trim()));
      document.getElementById('azureDeployment').addEventListener('input', e => localStorage.setItem(LS_DEPLOYMENT, e.target.value.trim()));
      setSource(source);
      initWebSocket();
      log('頁面就緒');
      setTimeout(refreshEsp32Status, 300);
    });

    function setSource(s) {
      source = s;
      localStorage.setItem(LS_SOURCE, s);
      document.querySelectorAll('#sourceToggle .mode-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.source === s);
      });
    }

    function setPrompt(t) {
      document.getElementById('promptInput').value = t;
    }

    // ---------- WebSocket ----------
    function initWebSocket() {
      const gateway = `ws://${window.location.hostname}/ws`;
      log(`連線 ${gateway} ...`);
      websocket = new WebSocket(gateway);
      websocket.onopen = () => { setWsPill(true); log('WebSocket 已連線'); };
      websocket.onclose = () => {
        setWsPill(false);
        log('WebSocket 已關閉,2 秒後重試');
        setTimeout(initWebSocket, 2000);
      };
      websocket.onerror = () => log('WebSocket 錯誤');
      websocket.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d.type) log(`← ${e.data.substring(0, 120)}`);
        } catch (_) {}
      };
    }

    function setWsPill(on) {
      const el = document.getElementById('wsPill');
      el.textContent = on ? '已連線' : '未連線';
      el.className = 'ws-pill ' + (on ? 'ws-on' : 'ws-off');
    }

    function wsSend(payload) {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) {
        log('!! WebSocket 未連線,無法送出');
        return false;
      }
      const text = JSON.stringify(payload);
      websocket.send(text);
      log(`→ ${text.substring(0, 160)}${text.length > 160 ? '...' : ''}`);
      return true;
    }

    // ---------- 產生 ----------
    async function generate() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) { setGenStatus('請先輸入需求', 'warn'); return; }
      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      setGenStatus('產生中...', 'info');

      try {
        let prog, raw;
        if (source === 'mock') {
          ({ prog, raw } = mockGenerate(prompt));
          await sleep(200);
        } else {
          ({ prog, raw } = await azureGenerate(prompt));
        }
        document.getElementById('jsonOutput').value = JSON.stringify(prog, null, 2);
        validateJson();
        setGenStatus(`已產生 (${source === 'mock' ? 'Mock' : 'Azure OpenAI'})`, 'ok');
        log(`產生完成: ${countCommands(prog)} 個指令`);
      } catch (err) {
        setGenStatus('產生失敗: ' + err.message, 'error');
        log(`!! 產生失敗: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function azureGenerate(prompt) {
      const endpoint   = document.getElementById('azureEndpoint').value.trim().replace(/\/$/, '');
      const apiKey     = document.getElementById('azureApiKey').value.trim();
      const deployment = document.getElementById('azureDeployment').value.trim();

      if (!endpoint || !apiKey || !deployment) throw new Error('請先填寫 Azure OpenAI 設定（Endpoint / API Key / Deployment）');

      const url = `${endpoint}/openai/deployments/${deployment}/chat/completions?api-version=${AZURE_API_VERSION}`;

      const resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'api-key': apiKey
        },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user',   content: prompt }
          ],
          temperature: 0.2,
          response_format: { type: 'json_object' }
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(`Azure API ${resp.status}: ${err.error?.message || resp.statusText}`);
      }

      const data = await resp.json();
      const text = data.choices?.[0]?.message?.content || '';
      const prog = JSON.parse(text);
      return { prog, raw: text };
    }

    // ---------- Mock ----------
    function mockGenerate(prompt) {
      const p = prompt.toLowerCase();
      let prog = { mode: 'PROG', setup: [], loop: [] };
      const motorMatch = p.match(/馬達\s*([1-4])/);
      const servoMatch = p.match(/舵機\s*([1-2])/);
      const secMatch = p.match(/(\d+)\s*秒/);
      const reverse = /反|倒退|逆/.test(p);

      if (motorMatch) {
        const motor = parseInt(motorMatch[1], 10);
        const duty = reverse ? -60 : 60;
        const ms = secMatch ? Math.min(parseInt(secMatch[1], 10) * 1000, 10000) : 2000;
        prog.loop = [
          { cmd: 'pwm', motor, duty },
          { cmd: 'delay', ms },
          { cmd: 'stop', motor },
          { cmd: 'delay', ms: 3000 }
        ];
      } else if (servoMatch) {
        const ch = parseInt(servoMatch[1], 10);
        prog.setup = [{ cmd: 'servo', ch, deg: 0 }];
        prog.loop = [
          { cmd: 'servo', ch, deg: 180 },
          { cmd: 'delay', ms: 1000 },
          { cmd: 'servo', ch, deg: 0 },
          { cmd: 'delay', ms: 1000 }
        ];
      } else {
        prog.loop = [{ cmd: 'delay', ms: 1000 }];
      }
      return { prog, raw: '[mock] ' + JSON.stringify(prog) };
    }

    // ---------- 驗證 ----------
    function validateJson() {
      const txt = document.getElementById('jsonOutput').value;
      const status = document.getElementById('validateStatus');
      status.style.display = 'block';
      try {
        const obj = JSON.parse(txt);
        const errs = validateProg(obj);
        if (errs.length === 0) {
          status.className = 'status-line status-ok';
          status.textContent = `✓ 合法 (${countCommands(obj)} 個指令)`;
          return obj;
        } else {
          status.className = 'status-line status-error';
          status.textContent = '✗ ' + errs.join('; ');
          return null;
        }
      } catch (e) {
        status.className = 'status-line status-error';
        status.textContent = '✗ JSON 解析失敗: ' + e.message;
        return null;
      }
    }

    function validateProg(obj) {
      const errs = [];
      if (!obj || typeof obj !== 'object') { errs.push('不是物件'); return errs; }
      if (obj.mode !== 'PROG') errs.push('mode 必須是 "PROG"');
      ['setup', 'loop'].forEach(k => {
        if (!Array.isArray(obj[k])) { errs.push(`${k} 必須是陣列`); return; }
        obj[k].forEach((c, i) => {
          const ce = validateCmd(c);
          if (ce) errs.push(`${k}[${i}] ${ce}`);
        });
      });
      const total = countCommands(obj);
      if (total > MAX_COMMANDS) errs.push(`指令總數 ${total} > 上限 ${MAX_COMMANDS}`);
      return errs;
    }

    function validateCmd(c) {
      if (!c || typeof c !== 'object') return '不是物件';
      if ('cmd' in c && 'command' in c) return 'cmd 與 command 不可同時出現';
      if (typeof c.cmd === 'string') {
        if (!ALLOWED_CMDS.includes(c.cmd)) return `未知 cmd "${c.cmd}"`;
        if (c.cmd === 'pwm') {
          if (!Number.isInteger(c.motor) || c.motor < 1 || c.motor > 4) return 'pwm.motor 必須 1-4';
          if (!Number.isInteger(c.duty)  || c.duty < -100 || c.duty > 100) return 'pwm.duty 必須 -100..100';
        } else if (c.cmd === 'stop') {
          if (c.motor !== undefined && (!Number.isInteger(c.motor) || c.motor < 0 || c.motor > 4)) return 'stop.motor 必須 0-4';
        } else if (c.cmd === 'servo') {
          if (!Number.isInteger(c.ch)  || c.ch < 1 || c.ch > 2) return 'servo.ch 必須 1-2';
          if (!Number.isInteger(c.deg) || c.deg < 0 || c.deg > 180) return 'servo.deg 必須 0-180';
        } else if (c.cmd === 'delay') {
          if (!Number.isInteger(c.ms) || c.ms < 0 || c.ms > 10000) return 'delay.ms 必須 0-10000';
        } else if ((c.cmd === 'move_to' || c.cmd === 'move_by')) {
          if (!Number.isInteger(c.motor) || c.motor < 3 || c.motor > 4) return 'move_to.motor 必須 3 或 4（需有編碼器）';
          if (!Number.isInteger(c.deg) || c.deg < -2147483648 || c.deg > 2147483647) return 'move_to.deg 必須是整數（centi-deg，90°=9000）';
        } else if (c.cmd === 'speed') {
          if (!Number.isInteger(c.motor) || c.motor < 3 || c.motor > 4) return 'speed.motor 必須 3 或 4';
          if (!Number.isInteger(c.rpm) || (c.rpm !== 0 && (c.rpm < 60 || c.rpm > 250))) return 'speed.rpm 必須 0 或 60..250';
        } else if (c.cmd === 'zero') {
          if (!Number.isInteger(c.motor) || c.motor < 3 || c.motor > 4) return 'zero.motor 必須 3 或 4';
        }
        return null;
      }
      if (typeof c.command === 'string') {
        if (!ALLOWED_BLOCKLY_CMDS.includes(c.command)) return `未知 command "${c.command}"`;
        if (c.command === 'if') {
          const ce = validateCondition(c.condition);
          if (ce) return `if.condition ${ce}`;
          if (!Array.isArray(c.then)) return 'if.then 必須是陣列';
          if (c.else !== undefined && !Array.isArray(c.else)) return 'if.else 必須是陣列';
          for (let i = 0; i < c.then.length; i++) {
            const e = validateCmd(c.then[i]);
            if (e) return `if.then[${i}] ${e}`;
          }
          for (let i = 0; i < (c.else?.length || 0); i++) {
            const e = validateCmd(c.else[i]);
            if (e) return `if.else[${i}] ${e}`;
          }

        }
        return null;
      }
      return '缺少 cmd 或 command';
    }

    function validateCondition(c) {
      if (!c || typeof c !== 'object') return '不是物件';
      if ('cmd' in c && 'command' in c) return 'cmd 與 command 不可同時出現';
      if (c.command !== 'logic_compare') return 'condition.command 必須是 logic_compare';
      if (!ALLOWED_OPS.includes(c.operator)) return `operator 必須是 ${ALLOWED_OPS.join('/')}`;
      const le = validateOperand(c.left);
      if (le) return `left ${le}`;
      const re = validateOperand(c.right);
      if (re) return `right ${re}`;
      return null;
    }

    function validateOperand(v) {
      if (typeof v === 'number' && Number.isInteger(v)) return null;
      if (v && typeof v === 'object' && typeof v.command === 'string') {
        if ('cmd' in v) return 'cmd 與 command 不可同時出現';
        if (!ALLOWED_READ_CMDS.includes(v.command)) return `未知 read command "${v.command}"`;
        if (v.command === 'arduinoUltrasonic') {
          const t = typeof v.trigPin === 'string' && /^[0-9]+$/.test(v.trigPin) ? Number(v.trigPin) : v.trigPin;
          const e = typeof v.echoPin === 'string' && /^[0-9]+$/.test(v.echoPin) ? Number(v.echoPin) : v.echoPin;
          if (!Number.isInteger(t) || t < 0 || t > 39) return 'arduinoUltrasonic.trigPin 必須 0-39';
          if (!Number.isInteger(e) || e < 0 || e > 39) return 'arduinoUltrasonic.echoPin 必須 0-39';
        } else if (v.command === 'legoButton') {
          const p = typeof v.pin === 'string' && /^[0-9]+$/.test(v.pin) ? Number(v.pin) : v.pin;
          if (!Number.isInteger(p) || p < 0 || p > 39) return 'legoButton.pin 必須 0-39';
        }
        return null;
      }
      return '必須是整數或 read_* 指令物件';
    }

    function countCommands(obj) {
      return countList(obj?.setup) + countList(obj?.loop);
    }

    function countList(arr) {
      if (!Array.isArray(arr)) return 0;
      let n = 0;
      for (const c of arr) {
        n++;
        if (c && c.command === 'if') n += countList(c.then) + countList(c.else);
      }
      return n;
    }

    // ---------- 動作 ----------
    function runProgram() {
      const prog = validateJson();
      if (!prog) { log('!! JSON 不合法,拒絕送出'); return; }
      if (!websocket || websocket.readyState !== WebSocket.OPEN) { log('!! WebSocket 未連線'); return; }
      wsSend(prog);
    }

    function stopProgram() {
      wsSend({ mode: 'PROG', setup: [], loop: [] });
      log('已送出停止程式');
    }

    function emergencyStop() {
      wsSend({ cmd: 'stop' });
    }

    function copyJson() {
      const ta = document.getElementById('jsonOutput');
      ta.select();
      try {
        navigator.clipboard.writeText(ta.value);
        log('已複製到剪貼簿');
      } catch (_) {
        document.execCommand('copy');
      }
    }

    function clearJson() {
      document.getElementById('jsonOutput').value = '';
      document.getElementById('validateStatus').style.display = 'none';
    }

    // ---------- ESP32 LittleFS ----------
    function setStoreStatus(text, kind) {
      const el = document.getElementById('storeStatus');
      el.style.display = 'block';
      el.className = 'status-line status-' + (kind || 'info');
      el.textContent = text;
    }

    async function saveToEsp32() {
      const prog = validateJson();
      if (!prog) { setStoreStatus('JSON 不合法,無法存檔', 'error'); return; }
      try {
        const resp = await fetch('/api/program', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ json: prog, source: 'ai' })
        });
        const data = await resp.json();
        if (data.ok) {
          setStoreStatus(`✓ 已存入 ESP32 (${countCommands(prog)} 個指令)`, 'ok');
          log(`已存入 ESP32,source=${data.source}`);
        } else {
          setStoreStatus('✗ 存檔失敗: ' + (data.error || ''), 'error');
        }
      } catch (e) {
        setStoreStatus('✗ 無法連到 ESP32: ' + e.message, 'error');
      }
    }

    async function loadFromEsp32() {
      try {
        const resp = await fetch('/api/program');
        const data = await resp.json();
        if (!data.ok || !data.has_program) { setStoreStatus('ESP32 上沒有存檔', 'warn'); return; }
        document.getElementById('jsonOutput').value = JSON.stringify(data.json, null, 2);
        validateJson();
        const src = data.meta?.source || 'unknown';
        setStoreStatus(`✓ 已從 ESP32 載入 (來源: ${src})`, 'ok');
        log(`從 ESP32 載入,source=${src}`);
      } catch (e) {
        setStoreStatus('✗ 載入失敗: ' + e.message, 'error');
      }
    }

    async function deleteEsp32() {
      if (!confirm('確定要刪除 ESP32 上的存檔嗎?')) return;
      try {
        const resp = await fetch('/api/program', { method: 'DELETE' });
        const data = await resp.json();
        if (data.ok) { setStoreStatus('✓ 已刪除 ESP32 存檔', 'ok'); log('已刪除 ESP32 存檔'); }
      } catch (e) {
        setStoreStatus('✗ 刪除失敗: ' + e.message, 'error');
      }
    }

    async function onAutorunToggle(on) {
      try {
        const resp = await fetch('/api/program/autorun', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ on })
        });
        const data = await resp.json();
        if (data.ok) {
          setStoreStatus(`✓ 開機自動執行: ${on ? '已開啟' : '已關閉'}`, 'ok');
          log(`autorun = ${on ? 'ON' : 'OFF'}`);
        }
      } catch (e) {
        document.getElementById('autorunToggle').checked = !on;
        setStoreStatus('✗ 設定 autorun 失敗: ' + e.message, 'error');
      }
    }

    async function refreshEsp32Status() {
      try {
        const resp = await fetch('/api/program');
        if (!resp.ok) return;
        const data = await resp.json();
        document.getElementById('autorunToggle').checked = !!data.autorun;
        if (data.has_program && data.json) {
          document.getElementById('jsonOutput').value = JSON.stringify(data.json, null, 2);
          validateJson();
          const src = data.meta?.source || 'unknown';
          log(`頁面開啟:ESP32 上有現存程式 (source=${src})`);
        }
      } catch (e) {
        // ESP32 沒接通就靜默
      }
    }

    // ---------- helpers ----------
    function setGenStatus(text, kind) {
      const el = document.getElementById('genStatus');
      el.textContent = text;
      el.style.color = ({ ok: '#1e7a3a', warn: '#b76b00', error: '#b3261e', info: '#3949ab' }[kind]) || '#666';
    }

    function log(msg) {
      const el = document.getElementById('log');
      const t = new Date().toLocaleTimeString();
      el.textContent = `[${t}] ${msg}\n` + el.textContent;
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
