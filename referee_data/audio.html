<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中央音效台 · 相撲比賽</title><link rel="stylesheet" href="portal.css?v=20261104-arenas"></head><body><main>
<a href="/">← 比賽中心</a><p class="eyebrow">SPEAKER DESK</p><h1>中央音效台</h1><p>這台電腦接上喇叭，按「啟用中央音效」後保持本頁開啟。A、B 場的開始與結束提示可同時播放。</p>
<section><div class="controls"><button id="enable" class="primary">啟用中央音效</button><button id="disable" disabled>停止中央播放</button><label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label></div><p class="muted">中央連線時，裁判頁自動靜音。中央離線不會停止比賽；裁判可在自己的頁面手動接回音效。音檔須先隨裁判網頁上傳至板子。</p></section>
<div class="cards"><section class="card"><span>A 場</span><h2 id="phaseA">等待啟用</h2><div id="clockA" class="clock">—</div><p id="statusA">尚未播放</p><p id="eventA" class="muted"></p></section><section class="card"><span>B 場</span><h2 id="phaseB">等待啟用</h2><div id="clockB" class="clock">—</div><p id="statusB">尚未播放</p><p id="eventB" class="muted"></p></section></div>
<p id="notice" role="alert"></p></main><script src="referee_session.js?v=20261104-arenas"></script><script src="competition_audio.js?v=20261104-arenas"></script><script src="central_audio.js?v=20261104-multi"></script></body></html>
